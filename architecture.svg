<svg width="680" height="604" viewBox="0 0 680 604" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Competitive Intelligence Crew architecture</title>
<desc>CLI input flows into main.py, which validates API keys, then hands off to a Searcher agent that uses the Serper API, producing research findings that are passed to an Analyst agent, which synthesizes them into report.md.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect width="680" height="604" fill="#FDFCFA"/>

<!-- CLI input -->
<rect x="180" y="40" width="320" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="60" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">CLI input</text>
<text x="340" y="78" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">Company name + focus areas</text>
<line x1="340" y1="96" x2="340" y2="136" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- main.py -->
<rect x="180" y="136" width="320" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="156" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">main.py</text>
<text x="340" y="174" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">Loads .env, validates API keys</text>
<line x1="340" y1="192" x2="340" y2="232" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Searcher agent -->
<rect x="180" y="232" width="320" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="252" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Searcher agent</text>
<text x="340" y="270" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">Serper web search</text>
<line x1="340" y1="288" x2="340" y2="328" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Research findings -->
<rect x="180" y="328" width="320" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="350" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Research findings passed as context</text>
<line x1="340" y1="372" x2="340" y2="412" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Analyst agent -->
<rect x="180" y="412" width="320" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="432" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Analyst agent</text>
<text x="340" y="450" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">LLM synthesis (OpenAI/Anthropic)</text>
<line x1="340" y1="468" x2="340" y2="508" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- report.md -->
<rect x="180" y="508" width="320" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="528" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">report.md</text>
<text x="340" y="546" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">Structured competitive intel report</text>
</svg>
